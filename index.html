<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Blindagem Total: Cabine Limpa</title>
<!--
  ============================================================================
  BLINDAGEM TOTAL: CABINE LIMPA
  Jogo educacional de biossegurança — pós-graduação em Estética.
  Arquivo único. Sem CDN, sem fonte externa, sem backend, sem API.
  Sem localStorage / sessionStorage: o estado vive apenas em memória.
  Recarregar a página reinicia a sessão.

  MAPA DO ARQUIVO
    [CSS]        tokens de cor, layout, componentes, acessibilidade
    [MARCAÇÃO]   telas: abertura, briefing, tutorial, etapas 1/2/3, relatório
    [CONFIG]     constantes editáveis pelo docente
    [FOTOS]      data URIs das 3 cenas (ver seção "COMO EMBUTIR AS FOTOS")
    [BANCO]      não conformidades + elementos adequados
    [DILEMAS]    banco de 6 dilemas
    [ENGINE]     estado, navegação, cronômetro, visor de cena, zoom/pan
    [ETAPA2]     conectar camadas
    [ETAPA3]     decisão em cabine
    [RELATORIO]  cálculo por camada e resumo copiável
  ============================================================================
-->
<style>
/* ========================= [CSS] TOKENS ================================== */
:root{
  --branco:#ffffff;
  --fundo:#f5f7f7;
  --fundo-2:#eceff0;
  --borda:#d5dbdb;
  --borda-forte:#b4bdbd;
  --tinta:#15201d;          /* texto principal */
  --tinta-2:#4a5350;        /* texto secundário — 7.9:1 sobre branco */

  /* Verde-água: #2E8B7A rende 4.13:1 sobre branco e NÃO passa em AA para
     texto pequeno. Fica só em preenchimento; o texto usa a variante escura. */
  --verde:#2E8B7A;          /* só preenchimento: barras de progresso, pinos */
  --verde-texto:#1F6A5B;    /* 6.4:1 sobre branco */
  --verde-forte:#1F6A5B;    /* fundo de botão: texto branco rende 6.4:1 aqui.
                               Sobre #2E8B7A o branco renderia 4.13:1 e
                               reprovaria em AA para texto de 15px. */
  --verde-fraco:#e6f2ef;

  /* Âmbar: #D97706 rende 3.19:1 sobre branco. Só preenchimento. */
  --ambar:#D97706;
  --ambar-texto:#8A5200;    /* 6.4:1 sobre branco */
  --ambar-fraco:#fdf3e3;

  /* Vermelho: #DC2626 passa (4.8:1), mas o texto usa a variante mais escura. */
  --vermelho:#DC2626;
  --vermelho-texto:#B91C1C; /* 6.5:1 sobre branco */
  --vermelho-fraco:#fdeaea;

  --azul-texto:#1B4F72;
  --azul-fraco:#e8eff5;

  --raio:10px;
  --alvo:44px;              /* alvo mínimo de toque (WCAG) nos botões de interface */
  --alvo-visor:44px;        /* área de toque dos alvos SOBRE a foto; ampliada no dedo */
  --topo:0px;               /* altura real do cabeçalho, medida em JS */
  --transicao:160ms;
}
/* Dedo não é ponteiro fino: 44 px é o mínimo legal, não o confortável. Sobre a
   foto, onde o alvo é invisível de propósito, a margem precisa ser maior.
   Ajuste ESTE número para calibrar a facilidade da inspeção no celular. */
@media (pointer:coarse){
  :root{ --alvo-visor:58px; }
}
@media (prefers-reduced-motion: reduce){
  :root{ --transicao:0ms; }
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--fundo);
  color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;
}
h1,h2,h3{ line-height:1.25; margin:0 0 .4em; font-weight:700; }
h1{ font-size:1.4rem; } h2{ font-size:1.15rem; } h3{ font-size:1rem; }
p{ margin:0 0 .7em; }
ul,ol{ margin:0 0 .7em; padding-left:1.2em; }
li{ margin-bottom:.35em; }
b,strong{ font-weight:700; }
:focus-visible{ outline:3px solid #0b5cab; outline-offset:2px; border-radius:4px; }
.oculto{ display:none !important; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ========================= [CSS] ESTRUTURA =============================== */
#app{ max-width:520px; margin:0 auto; background:var(--branco); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }

header#topo{
  position:sticky; top:0; z-index:40; background:var(--branco);
  border-bottom:1px solid var(--borda); padding:8px 10px 0;
}
.topo-linha{ display:flex; align-items:center; gap:6px; }
.marca{ font-size:.78rem; font-weight:700; letter-spacing:.02em; color:var(--verde-texto); flex:1; min-width:0;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topo-acoes{ display:flex; gap:4px; flex-shrink:0; }
.icone-btn{
  min-width:var(--alvo); min-height:var(--alvo); border:1px solid var(--borda);
  background:var(--branco); border-radius:var(--raio); cursor:pointer;
  font-size:.68rem; font-weight:700; color:var(--tinta-2); padding:2px 6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; line-height:1.1;
}
.icone-btn:hover{ background:var(--fundo-2); }
.icone-btn[aria-pressed="true"]{ background:var(--verde-fraco); border-color:var(--verde); color:var(--verde-texto); }
.icone-btn .g{ font-size:1rem; }

/* passos */
nav#passos{ display:flex; gap:4px; padding:8px 0 9px; }
/* Indicadores de progresso: não são acionáveis, por isso são div e não
   button — assim não entram na regra de alvo de toque de 44x44. */
.passo{
  flex:1; display:flex; flex-direction:column; gap:4px; border-radius:6px;
}
.passo .barra{ height:5px; border-radius:3px; background:var(--fundo-2); overflow:hidden; }
.passo .barra i{ display:block; height:100%; width:0; background:var(--verde); transition:width var(--transicao) ease; }
.passo .rot{ font-size:.62rem; font-weight:700; color:var(--tinta-2); letter-spacing:.02em;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.passo[aria-current="step"] .rot{ color:var(--verde-texto); }
.passo[aria-current="step"] .barra{ box-shadow:0 0 0 2px var(--verde-fraco); }

main{ flex:1; padding:14px 14px 110px; }
.tela{ animation:entra var(--transicao) ease; }
@keyframes entra{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

/* ========================= [CSS] COMPONENTES ============================= */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:var(--alvo); padding:11px 16px; border-radius:var(--raio);
  border:1px solid var(--verde-forte); background:var(--verde-forte); color:#fff;
  font:inherit; font-weight:700; font-size:.92rem; cursor:pointer; text-align:center;
  transition:filter var(--transicao) ease;
}
.btn:hover{ filter:brightness(1.07); }
.btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
.btn.sec{ background:var(--branco); color:var(--verde-texto); border-color:var(--borda-forte); }
.btn.sec:hover{ background:var(--verde-fraco); }
.btn.neutro{ background:var(--branco); color:var(--tinta-2); border-color:var(--borda-forte); }
.btn.neutro:hover{ background:var(--fundo-2); }
.btn.perigo{ background:var(--branco); color:var(--vermelho-texto); border-color:var(--vermelho-texto); }
.btn.bloco{ display:flex; width:100%; }
.btn-linha{ display:flex; gap:8px; flex-wrap:wrap; }
.btn-linha>.btn{ flex:1 1 140px; }

.cartao{ border:1px solid var(--borda); border-radius:var(--raio); padding:13px; background:var(--branco); margin-bottom:11px; }
.cartao.suave{ background:var(--fundo); }
.selo{
  display:inline-flex; align-items:center; gap:5px; font-size:.7rem; font-weight:700;
  padding:3px 8px; border-radius:99px; border:1px solid; letter-spacing:.02em; line-height:1.3;
}
.selo.ok{ color:var(--verde-texto); border-color:var(--verde); background:var(--verde-fraco); }
.selo.at{ color:var(--ambar-texto); border-color:var(--ambar); background:var(--ambar-fraco); }
.selo.rv{ color:var(--vermelho-texto); border-color:var(--vermelho); background:var(--vermelho-fraco); }
.selo.inf{ color:var(--azul-texto); border-color:#7ea6c4; background:var(--azul-fraco); }
.selo.neutro{ color:var(--tinta-2); border-color:var(--borda-forte); background:var(--fundo-2); }

.aviso{ border-left:4px solid var(--ambar); background:var(--ambar-fraco); padding:10px 12px; border-radius:0 var(--raio) var(--raio) 0; font-size:.85rem; margin-bottom:11px; }
.aviso.info{ border-left-color:#7ea6c4; background:var(--azul-fraco); }
.aviso.grave{ border-left-color:var(--vermelho); background:var(--vermelho-fraco); }
.aviso.bom{ border-left-color:var(--verde); background:var(--verde-fraco); }
.aviso p:last-child{ margin-bottom:0; }

.miudo{ font-size:.78rem; color:var(--tinta-2); }
.miudo-2{ font-size:.72rem; color:var(--tinta-2); }
.rotulo{ font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--tinta-2); margin-bottom:5px; }

details.mais{ border:1px solid var(--borda); border-radius:var(--raio); margin:9px 0; background:var(--fundo); }
details.mais>summary{ cursor:pointer; padding:11px 12px; font-weight:700; font-size:.84rem; min-height:var(--alvo);
  display:flex; align-items:center; gap:6px; color:var(--verde-texto); list-style:none; }
details.mais>summary::-webkit-details-marker{ display:none; }
details.mais>summary::before{ content:"▸"; transition:transform var(--transicao) ease; }
details.mais[open]>summary::before{ transform:rotate(90deg); }
details.mais>div{ padding:0 12px 12px; font-size:.84rem; }

/* ========================= [CSS] VISOR DE CENA =========================== */
.visor-caixa{ margin:0 -14px 10px; background:#10201d; position:relative; }
.visor{
  position:relative; width:100%; overflow:hidden; background:#10201d;
  touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none;
}
.visor.arrastando{ cursor:grabbing; }
/* Confirmação de que o toque foi recebido. Aparece em QUALQUER ponto tocado,
   acerte ou não um alvo: confirma o gesto sem entregar onde está a resposta. */
.toque-eco{
  position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px;
  border-radius:50%; border:2px solid rgba(255,255,255,.85);
  pointer-events:none; z-index:3; animation:eco 420ms ease-out forwards;
}
@keyframes eco{ from{ transform:scale(.35); opacity:.9 } to{ transform:scale(1.3); opacity:0 } }
.palco{ position:absolute; inset:0; transform-origin:0 0; will-change:transform; }
.palco img{ display:block; width:100%; height:100%; object-fit:contain; pointer-events:none; }

.alvo{
  /* --iz é o inverso da ampliação: mantém o alvo com tamanho constante na
     tela mesmo quando o palco está ampliado, preservando os 44x44 px. */
  position:absolute; transform:translate(-50%,-50%) scale(var(--iz,1));
  min-width:var(--alvo-visor); min-height:var(--alvo-visor);
  border:0; background:transparent; padding:0; margin:0; cursor:pointer;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
}
/* Antes da descoberta o alvo não tem contorno: nada entrega a resposta. */
.alvo .pino{ width:0; height:0; opacity:0; }
.alvo:focus-visible .pino{ width:26px; height:26px; opacity:1; border-radius:50%; border:3px dashed #fff; }
.alvo.achado .pino,.alvo.inspecionado .pino{
  width:30px; height:30px; opacity:1; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:.85rem; font-weight:700; color:#fff; border:2px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.5); animation:pop var(--transicao) ease;
}
@keyframes pop{ from{ transform:scale(.6);} to{ transform:scale(1);} }
.alvo.achado .pino{ background:var(--vermelho); }
.alvo.tratado .pino{ background:var(--verde); }
.alvo.rever .pino{ background:var(--ambar); }
.alvo.inspecionado .pino{ background:#2c6ea8; }
.alvo.grupo .pino{ border-radius:8px; }

.visor-barra{ display:flex; gap:5px; padding:7px 14px; background:#10201d; align-items:center; flex-wrap:wrap; }
.visor-barra .zbtn{
  min-width:var(--alvo); min-height:var(--alvo); border-radius:8px;
  background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28);
  font-size:1rem; font-weight:700; cursor:pointer; padding:0 9px;
}
.visor-barra .zbtn:hover{ background:rgba(255,255,255,.22); }
.visor-barra .zbtn:disabled{ opacity:.35; cursor:not-allowed; }
.visor-barra .info{ color:#d7e3e0; font-size:.72rem; margin-left:auto; text-align:right; line-height:1.3; }
.legenda-sim{ font-size:.63rem; color:#9fb3af; padding:0 14px 7px; background:#10201d; }

.hud{ display:flex; gap:7px; align-items:center; margin-bottom:9px; flex-wrap:wrap; }
.crono{
  font-variant-numeric:tabular-nums; font-weight:700; font-size:.9rem;
  padding:6px 11px; border-radius:99px; border:1px solid var(--borda-forte); background:var(--fundo);
  display:inline-flex; align-items:center; gap:6px; min-height:34px;
}
.crono.baixo{ border-color:var(--ambar); background:var(--ambar-fraco); color:var(--ambar-texto); }
.crono.pausado{ border-color:#7ea6c4; background:var(--azul-fraco); color:var(--azul-texto); }
.contador{ font-size:.8rem; color:var(--tinta-2); font-weight:700; }

/* ========================= [CSS] FICHA / MODO TEXTUAL ==================== */
.ficha-item{
  width:100%; text-align:left; border:1px solid var(--borda); border-radius:var(--raio);
  background:var(--branco); padding:11px 12px; margin-bottom:8px; cursor:pointer;
  font:inherit; font-size:.87rem; min-height:var(--alvo); display:block;
}
.ficha-item:hover{ background:var(--fundo); }
.ficha-item .loc{ font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--tinta-2); display:block; margin-bottom:3px; }
.ficha-item.achado{ border-left:5px solid var(--vermelho); }
.ficha-item.tratado{ border-left:5px solid var(--verde); }
.ficha-item.rever{ border-left:5px solid var(--ambar); }
.ficha-item.inspecionado{ border-left:5px solid #2c6ea8; }
.ficha-item .est{ display:block; margin-top:6px; }

/* ========================= [CSS] DIÁLOGO ================================= */
.fundo-modal{ position:fixed; inset:0; background:rgba(10,20,18,.62); z-index:90; display:flex; align-items:flex-end; justify-content:center; }
@media(min-width:560px){ .fundo-modal{ align-items:center; } }
.modal{
  background:var(--branco); width:100%; max-width:520px; max-height:88vh; max-height:88dvh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:16px 15px calc(16px + env(safe-area-inset-bottom));
  animation:sobe var(--transicao) ease; -webkit-overflow-scrolling:touch;
}
@media(min-width:560px){ .modal{ border-radius:16px; } }
@keyframes sobe{ from{ transform:translateY(14px); opacity:.4;} to{ transform:none; opacity:1;} }
.modal-topo{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:9px; }
.fechar{ min-width:var(--alvo); min-height:var(--alvo); border:1px solid var(--borda); background:var(--branco);
  border-radius:var(--raio); font-size:1.1rem; cursor:pointer; color:var(--tinta-2); flex-shrink:0; }
.fechar:hover{ background:var(--fundo-2); }

/* opções de conduta / alternativas de dilema */
.opcao{
  display:block; width:100%; text-align:left; border:1px solid var(--borda); border-radius:var(--raio);
  background:var(--branco); padding:12px 13px; margin-bottom:9px; cursor:pointer;
  font:inherit; font-size:.87rem; line-height:1.45; min-height:var(--alvo);
}
.opcao:hover{ background:var(--fundo); border-color:var(--borda-forte); }
.opcao:disabled{ cursor:default; }
.opcao .letra{ font-weight:700; color:var(--verde-texto); margin-right:6px; }
.opcao.certa{ border-color:var(--verde); background:var(--verde-fraco); border-width:2px; }
.opcao.errada{ border-color:var(--vermelho); background:var(--vermelho-fraco); border-width:2px; }
.opcao.apagada{ opacity:.6; }
.marca-op{ display:block; margin-top:7px; font-size:.76rem; font-weight:700; }

/* ========================= [CSS] CAMADAS (ETAPA 2) ====================== */
.grade-camadas{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.camada-btn{
  min-height:62px; border:2px solid var(--borda); border-radius:var(--raio); background:var(--branco);
  font:inherit; font-size:.78rem; font-weight:700; cursor:pointer; padding:9px 7px; color:var(--tinta);
  display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.25;
}
.camada-btn:hover{ border-color:var(--verde); background:var(--verde-fraco); }
.camada-btn:disabled{ opacity:.5; cursor:not-allowed; }
.camada-btn .ic{ font-size:1.05rem; display:block; margin-bottom:3px; }

/* ========================= [CSS] RELATÓRIO ============================== */
table.rel{ width:100%; border-collapse:collapse; font-size:.78rem; margin-bottom:10px; }
table.rel th,table.rel td{ border:1px solid var(--borda); padding:6px 7px; text-align:left; vertical-align:top; }
table.rel th{ background:var(--fundo-2); font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; }
table.rel td.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.rolagem-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; }

.medidor{ margin-bottom:12px; }
.medidor .cab{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:4px; }
.medidor .val{ font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--verde-texto); }
.medidor .trilho{ height:13px; background:var(--fundo-2); border-radius:7px; overflow:hidden; border:1px solid var(--borda); }
.medidor .trilho i{ display:block; height:100%; background:var(--verde); width:0; transition:width 600ms ease; }
.medidor.alt .val{ color:var(--ambar-texto); }
.medidor.alt .trilho i{ background:var(--ambar); }

textarea.resumo{ width:100%; min-height:190px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.74rem; padding:10px; border:1px solid var(--borda-forte); border-radius:var(--raio); line-height:1.45; background:var(--fundo); color:var(--tinta); }

/* ========================= [CSS] RODAPÉ FIXO ============================ */
#rodape{
  position:fixed; bottom:0; left:0; right:0; z-index:35;
  background:var(--branco); border-top:1px solid var(--borda);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
}
#rodape .dentro{ max-width:520px; margin:0 auto; display:flex; gap:8px; }
#rodape .btn{ flex:1; }
/* ========================= [CSS] TELAS GRANDES ==========================
   O aluno pode estar no computador. Em tela larga o limite deixa de ser a
   largura e passa a ser a ALTURA: o visor é dimensionado pela altura útil
   (em JS, em dimensionar()) e a ficha de inspeção vem para o lado da foto.
   ====================================================================== */
@media (min-width:920px){
  #app{ max-width:1120px; }
  main{ padding:18px 22px 96px; }
  .tela{ max-width:780px; margin:0 auto; }
  .tela.tela-cena{ max-width:none; }
  /* A foto ocupa a coluna esquerda inteira; título, cronômetro e ficha vão
     para a direita. Isso devolve à imagem a altura que o cabeçalho da cena
     consumia — decisivo em notebook de 768 px. */
  .cena-grade{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:8px 18px;
               grid-template-rows:auto 1fr; grid-template-areas:"foto topo" "foto lado"; align-items:start; }
  .cena-topo{ grid-area:topo; }
  /* a foto acompanha a rolagem da ficha: sem isso, ler a lista ao lado
     tirava a cena da tela justamente quando ela é a referência. */
  .col-foto{ grid-area:foto; min-width:0; position:sticky; top:calc(var(--topo) + 12px); align-self:start; }
  .col-lado{ grid-area:lado; }
  .cena-topo .hud{ margin-bottom:0; }
  .col-lado>details.mais{ margin:0; }
  .visor-caixa{ margin:0; border-radius:12px; overflow:hidden; }
  .visor-barra{ padding:8px 10px; }
  .legenda-sim{ padding:0 10px 8px; }
  #rodape .dentro{ max-width:780px; }
  .modal{ max-width:620px; }
  table.rel{ font-size:.82rem; }
}
@media (min-width:1240px){
  .cena-grade{ grid-template-columns:minmax(0,1fr) 380px; }
}

.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:95;
  background:var(--tinta); color:#fff; padding:10px 16px; border-radius:99px;
  font-size:.82rem; font-weight:700; box-shadow:0 3px 14px rgba(0,0,0,.3); max-width:90vw; text-align:center;
}
</style>
</head>
<body>
<!-- ======================= [MARCAÇÃO] ================================== -->
<div id="app">

  <header id="topo">

function cenasAtivas(){ return CENAS.filter(c=>CONFIG.CENAS_ATIVAS.includes(c.id)); }
function itensAtivos(){
  return BANCO.filter(i=>CONFIG.CENAS_ATIVAS.includes(i.cenaId)
                      && !CONFIG.ITENS_DESATIVADOS.includes(i.id)
                      && i.statusValidacao !== "pendente");
}
function itensDaCena(cid){ return itensAtivos().filter(i=>i.cenaId===cid); }
function adequadosDaCena(cid){ return ADEQUADOS.filter(a=>a.cenaId===cid && CONFIG.CENAS_ATIVAS.includes(a.cenaId)); }
function neutrosDaCena(cid){ return NEUTROS.filter(n=>n.cenaId===cid); }
function itemPorId(id){ return BANCO.find(i=>i.id===id) || null; }
/* regDe CRIA o registro: use apenas quando for de fato registrar algo.
   Para leitura, use leReg — assim S.itens não se enche de registros vazios
   só porque a tela foi repintada. */
function regDe(id){
  if(!S.itens[id]) S.itens[id] = { id, identificado:false, comPista:false, naRevisao:false,
    condutaPrimeira:null, acertouPrimeira:false, resolvido:false, tentativas:0 };
  return S.itens[id];
}
const REG_VAZIO = Object.freeze({ identificado:false, comPista:false, naRevisao:false,
  condutaPrimeira:null, acertouPrimeira:false, resolvido:false, tentativas:0 });
function leReg(id){ return S.itens[id] || REG_VAZIO; }
function temFoto(cid){ return typeof FOTOS[cid]==="string" && FOTOS[cid].trim().length>40; }

/* blindagem: metade identificação, metade conduta */
function blindagemItem(id){
  const r = S.itens[id]; if(!r) return 0;
  return (r.identificado?0.5:0) + (r.resolvido?0.5:0);
}
function blindagemGeral(){
  const at = itensAtivos(); if(!at.length) return 0;
  return at.reduce((s,i)=>s+blindagemItem(i.id),0)/at.length;
}

const $ = s=>document.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") n.className = attrs[k];
    else if(k==="html") n.innerHTML = attrs[k];
    else if(k==="text") n.textContent = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(attrs[k]!==null && attrs[k]!==undefined && attrs[k]!==false) n.setAttribute(k, attrs[k]);
  }
  for(const kid of kids.flat()){ if(kid==null) continue;
    n.appendChild(typeof kid==="string" ? document.createTextNode(kid) : kid); }
  return n;
}
function limpar(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function anunciar(msg){ const a=$("#avisosVivos"); a.textContent=""; setTimeout(()=>a.textContent=msg, 60); }

let toastT=null;
function toast(msg){
  const ant=document.querySelector(".toast"); if(ant) ant.remove();
  const t=el("div",{class:"toast",role:"status"},msg); document.body.appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 2600);
}

/* Som sintetizado — sem arquivo externo, desligado por padrão. */
let audioCtx=null;
function bip(tipo){
  if(!S.som) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    const f = tipo==="ok"?660 : tipo==="rever"?320 : tipo==="fim"?440 : 520;
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.07, audioCtx.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.20);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.22);
  }catch(e){ /* som é opcional: falhar aqui não afeta o jogo */ }
}

/* ========================================================================
   [ENGINE] — DIÁLOGO ACESSÍVEL
   role=dialog + aria-modal, foco preso, Escape fecha, foco volta à origem.
   ======================================================================== */
let modalAberto=null, focoAnterior=null;
function abrirModal(titulo, construirCorpo, opc){
  opc = opc || {};
  if(modalAberto) fecharModal(true);
  focoAnterior = document.activeElement;
  const corpo = el("div");
  const cx = el("div",{class:"fundo-modal"},
    el("div",{class:"modal", role:"dialog", "aria-modal":"true", "aria-labelledby":"mdTit", tabindex:"-1"},
      el("div",{class:"modal-topo"},
        el("h2",{id:"mdTit",style:"margin:0;flex:1"}, titulo),
        opc.semFechar ? null : el("button",{class:"fechar", type:"button","aria-label":"Fechar",
          onclick:()=>fecharModal()},"✕")
      ),
      corpo
    )
  );
  construirCorpo(corpo, ()=>fecharModal());
  $("#modais").appendChild(cx);
  modalAberto = { cx, aoFechar: opc.aoFechar, semFechar: !!opc.semFechar };

  const caixa = cx.querySelector(".modal");
  const foca = caixa.querySelector("button,[href],input,select,textarea,[tabindex]:not([tabindex='-1'])");
  (foca||caixa).focus();

  cx.addEventListener("mousedown", e=>{ if(e.target===cx && !opc.semFechar) fecharModal(); });
  caixa.addEventListener("keydown", e=>{
    if(e.key==="Escape" && !opc.semFechar){ e.preventDefault(); fecharModal(); return; }
    if(e.key!=="Tab") return;
    const f=[...caixa.querySelectorAll("button,[href],input,select,textarea,[tabindex]:not([tabindex='-1'])")]
            .filter(x=>!x.disabled && x.offsetParent!==null);
    if(!f.length) return;
    const pri=f[0], ult=f[f.length-1];
    if(e.shiftKey && document.activeElement===pri){ e.preventDefault(); ult.focus(); }
    else if(!e.shiftKey && document.activeElement===ult){ e.preventDefault(); pri.focus(); }
  });
  if(typeof pausarCrono==="function") pausarCrono("modal");
  return modalAberto;
}
function fecharModal(silencioso){
  if(!modalAberto) return;
  const m=modalAberto; modalAberto=null;
  m.cx.remove();
  if(focoAnterior && document.contains(focoAnterior)) focoAnterior.focus();
  if(!silencioso && m.aoFechar) m.aoFechar();
  if(typeof retomarCrono==="function") retomarCrono("modal");
}

function confirmar(titulo, texto, rotuloOk, aoConfirmar, perigo){
  abrirModal(titulo, (c,fechar)=>{
    c.appendChild(el("p",{},texto));
    c.appendChild(el("div",{class:"btn-linha",style:"margin-top:12px"},
      el("button",{class:"btn "+(perigo?"perigo":"sec"),type:"button",onclick:()=>{ fecharModal(true); aoConfirmar(); }},rotuloOk),
      el("button",{class:"btn neutro",type:"button",onclick:()=>fechar()},"Cancelar")
    ));
  });
}

  if(n===1){
    const at=itensAtivos(); if(!at.length) return 0;
    return at.filter(i=>leReg(i.id).identificado).length/at.length;
  }
  if(n===2){ const t=S.e2.cartoes.length; return t? Object.keys(S.e2.resp).length/t : 0; }
  if(n===3){ const t=S.e3.lista.length; return t? Object.keys(S.e3.resp).length/t : 0; }
  return 0;
}

      el("span",{class:"rot"}, e.rot)

/* ========================================================================
   [ENGINE] — ALVOS: tipos, estados e rótulos
   ======================================================================== */
function alvoPorId(id){
  const i=itemPorId(id); if(i) return {tipo:"nc", d:i};
  const a=ADEQUADOS.find(x=>x.id===id); if(a) return {tipo:"ok", d:a};
  const n=NEUTROS.find(x=>x.id===id); if(n) return {tipo:"nt", d:n};
  return null;
}
function alvosDaCena(cena){
  return [...itensDaCena(cena.id), ...adequadosDaCena(cena.id), ...neutrosDaCena(cena.id)];
}
function alvosSoltos(cena){
  const dentro=new Set((cena.grupos||[]).flatMap(g=>g.alvos));
  return alvosDaCena(cena).filter(a=>!dentro.has(a.id));
}
/* Estados visuais distintos, sempre com cor + ícone + texto. */
const ESTADOS = {
  achado:      {cls:"achado",       ic:"!",  txt:"Risco identificado"},
  rever:       {cls:"rever",        ic:"~",  txt:"Conduta a rever"},
  tratado:     {cls:"tratado",      ic:"✓", txt:"Brecha tratada na simulação"},
  inspecionado:{cls:"inspecionado", ic:"i",  txt:"Elemento inspecionado"}
};
function estadoAlvo(id){
  const r=S.itens[id];
  if(r && r.identificado){
    if(r.resolvido) return "tratado";
    if(r.tentativas>0) return "rever";
    return "achado";
  }
  if(S.adequados[id] || S.neutros[id]) return "inspecionado";
  return "";
}
function jaVisto(id){ return !!estadoAlvo(id); }

/* ========================================================================
   [ENGINE] — CRONÔMETRO
   Pausa na leitura de feedback, na escolha de conduta e com a aba oculta.
   ======================================================================== */
let cronoId=null, cronoSeg=0, cronoPausas=new Set(), cronoEl=null, cronoAtivo=false;
function iniciarCrono(seg){
  pararCrono(); cronoSeg=seg; cronoPausas.clear(); cronoAtivo=true;
  pintarCrono(); tickar();
}
function tickar(){
  clearInterval(cronoId);
  cronoId=setInterval(()=>{
    if(!cronoAtivo || cronoPausas.size) return;
    cronoSeg--; pintarCrono();
    if(cronoSeg<=0){ pararCrono(); fimDeTempo(); }
  },1000);
}
function pararCrono(){ clearInterval(cronoId); cronoId=null; cronoAtivo=false; }
function pausarCrono(motivo){ cronoPausas.add(motivo); pintarCrono(); }
function retomarCrono(motivo){ cronoPausas.delete(motivo); pintarCrono(); }
function pintarCrono(){
  if(!cronoEl) return;
  if(!cronoAtivo){ cronoEl.classList.add("oculto"); return; }
  cronoEl.classList.remove("oculto");
  const mm=Math.max(0,cronoSeg);
  const pausado=cronoPausas.size>0;
  cronoEl.className="crono"+(pausado?" pausado":(mm<=15?" baixo":""));
  limpar(cronoEl);
  cronoEl.appendChild(el("span",{"aria-hidden":"true"}, pausado?"⏸":"⏱"));
  cronoEl.appendChild(el("span",{}, pausado ? "pausado" : `${String(Math.floor(mm/60)).padStart(1,"0")}:${String(mm%60).padStart(2,"0")}`));
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) pausarCrono("aba"); else retomarCrono("aba");
});

/* ========================================================================
   [ENGINE] — TELA DE CENA (ETAPA 1)
   ======================================================================== */
let refPintarCena=null;
function telaCena(){
  S.tela="cena"; S.emRevisao=false;
  const cena=cenasAtivas()[S.idxCena];
  if(!cena){ iniciarEtapa2(); return; }
  pintarPassos();
  const m=$("#palco"); limpar(m);
  const t=el("div",{class:"tela tela-cena"});
  const cenaTopo=el("div",{class:"cena-topo"});

  /* cabeçalho da cena */
  cenaTopo.appendChild(el("div",{style:"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px"},
    el("h1",{style:"margin:0;font-size:1.12rem;flex:1"},`Cena ${cena.ordem} — ${cena.nome}`),
    el("span",{class:"selo neutro"},`${cena.ordem} de ${cenasAtivas().length}`)
  ));

  /* HUD: cronômetro + contador + pista */
  const hud=el("div",{class:"hud"});
  cronoEl=el("div",{class:"crono oculto","aria-live":"off"});
  hud.appendChild(cronoEl);
  const cont=el("span",{class:"contador",id:"contCena"});
  hud.appendChild(cont);
  if(CONFIG.PISTAS_POR_CENA>0){
    hud.appendChild(el("button",{class:"btn sec",type:"button",id:"btPista",
      style:"padding:6px 14px;font-size:.78rem;flex:0 0 auto",
      onclick:()=>usarPista(cena)},"Pista"));
  }
  cenaTopo.appendChild(hud);

  /* corpo: em tela larga, foto à esquerda e ficha à direita.
     No celular as duas colunas empilham na mesma ordem de antes. */
  const grade=el("div",{class:"cena-grade"});
  const colFoto=el("div",{class:"col-foto",id:"corpoCena"});
  const colLado=el("div",{class:"col-lado"});
  grade.append(cenaTopo, colFoto, colLado);
  t.appendChild(grade);

  m.appendChild(t);

  refPintarCena=()=>{
    limpar(colFoto); limpar(colLado);
    if(temFoto(cena.id) && !S.modoTextual){
      colFoto.appendChild(montarVisor(cena));
      colLado.appendChild(fichaLateral(cena));
    }else{
      aplicarVisorAtual=null;
      colFoto.appendChild(montarFicha(cena));
    }
    atualizarContador(cena);
    pintarPassos();
    pintarRodapeCena(cena);
  };
  refPintarCena();

  if(!S.semTempo && !S.esgotou[cena.id]) iniciarCrono(CONFIG.SEGUNDOS_POR_CENA);
  else { pararCrono(); pintarCrono(); }
  $("#palco").focus();
}

function atualizarContador(cena){
  const c=$("#contCena"); if(!c) return;
  const its=itensDaCena(cena.id);
  const ach=its.filter(i=>leReg(i.id).identificado).length;
  const trat=its.filter(i=>leReg(i.id).resolvido).length;
  limpar(c);
  c.appendChild(el("span",{},`Cena: ${ach}/${its.length} identificados · ${trat}/${its.length} com conduta`));
}

function pintarRodapeCena(cena){
  const its=itensDaCena(cena.id);
  const faltam=its.filter(i=>!leReg(i.id).identificado).length;
  const ultima = S.idxCena >= cenasAtivas().length-1;
  const bts=[];
  if(S.emRevisao){
    bts.push(el("button",{class:"btn",type:"button",onclick:()=>{ S.emRevisao=false; avancarCena(); }},
      ultima?"Seguir para a Etapa 2":"Próxima cena"));
  }else{
    bts.push(el("button",{class:"btn "+(faltam?"neutro":""),type:"button",onclick:()=>{
      if(faltam){
        confirmar("Concluir esta cena?",
          `Ainda restam ${faltam} ${faltam===1?"item não identificado":"itens não identificados"} nesta cena. Você pode concluir agora e revisá-los depois — nada do que já foi respondido se perde.`,
          "Concluir mesmo assim",()=>{ avancarCena(); });
      } else avancarCena();
    }}, faltam ? "Concluir cena" : (ultima?"Seguir para a Etapa 2":"Próxima cena")));
  }
  rodape(bts);
}

function avancarCena(){
  pararCrono();
  S.idxCena++;
  if(S.idxCena >= cenasAtivas().length) iniciarEtapa2();
  else telaCena();
}

/* ========================================================================
   [ENGINE] — VISOR FOTOGRÁFICO: ampliar, mover, voltar à visão geral
   Toques em regiões neutras não penalizam. Arrastar não registra resposta.
   ======================================================================== */
const Z_MIN=1, Z_MAX=4;
function montarVisor(cena){
  const caixa=el("div",{class:"visor-caixa"});
  const visor=el("div",{class:"visor",style:"aspect-ratio:3/4"});
  const palco=el("div",{class:"palco"});
  const img=el("img",{src:FOTOS[cena.id], draggable:"false",
    alt:"Simulação fotográfica gerada para fins educacionais. "+cena.resumoNeutro});
  img.addEventListener("load",()=>{
    if(img.naturalWidth && img.naturalHeight)
      visor.style.aspectRatio = img.naturalWidth+" / "+img.naturalHeight;
    dimensionar(); aplicar();
  });
  palco.appendChild(img);

  /* alvos individuais */
  alvosSoltos(cena).forEach(a=>palco.appendChild(botaoAlvo(a.id, a.hotspot, cena)));
  /* alvos agrupados: uma vista ampliada, sem áreas sobrepostas */
  (cena.grupos||[]).forEach(g=>palco.appendChild(botaoGrupo(g, cena)));

  visor.appendChild(palco);

  let z=1, tx=0, ty=0;
  const ptrs=new Map(); let arrastou=false, mexeu=false, capturado=null, dist0=0, z0=1, mid0=null;

  function limites(){
    const w=visor.clientWidth, h=visor.clientHeight;
    tx=Math.min(0, Math.max(-(z-1)*w, tx));
    ty=Math.min(0, Math.max(-(z-1)*h, ty));
  }
  function aplicar(){
    limites();
    palco.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
    /* O alvo NÃO fica travado em tamanho de tela: ampliar precisa facilitar o
       toque, senão ampliar não serve para nada. Cresce com a raiz da
       ampliação — em 4x o alvo dobra na tela, sem invadir os vizinhos. */
    palco.style.setProperty("--iz", String(Math.pow(z,-0.5)));
    btMenos.disabled = z<=Z_MIN+0.001;
    btMais.disabled  = z>=Z_MAX-0.001;
    info.textContent = z>1.01
      ? `${z.toFixed(1)}× · arraste para mover`
      : (matchMedia("(pointer:fine)").matches ? "Clique para inspecionar · roda amplia" : "Toque para inspecionar");
  }
  function zoomEm(nz, px, py){
    nz=Math.min(Z_MAX,Math.max(Z_MIN,nz));
    const r=nz/z;
    tx = px - (px-tx)*r; ty = py - (py-ty)*r; z = nz;
    if(z<=Z_MIN+0.001){ tx=0; ty=0; }
    aplicar();
  }

  /* Confirmação de que o toque chegou. Aparece em qualquer ponto tocado,
     acerte ou não um alvo, então não entrega onde está a resposta. */
  function ecoDeToque(e){
    const r=visor.getBoundingClientRect();
    const d=el("span",{class:"toque-eco","aria-hidden":"true",
      style:`left:${(e.clientX-r.left).toFixed(0)}px; top:${(e.clientY-r.top).toFixed(0)}px`});
    visor.appendChild(d);
    setTimeout(()=>d.remove(),460);
  }

  visor.addEventListener("pointerdown",e=>{
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY});
    /* NÃO se captura o ponteiro aqui. Capturar no visor redireciona o
       pointerup para ele, e o navegador passa a disparar o click no visor em
       vez do botão do alvo que está embaixo do dedo — o toque simplesmente
       não registra. A captura só entra quando o gesto vira arrasto de fato. */
    if(ptrs.size===2){
      const [a,b]=[...ptrs.values()];
      dist0=Math.hypot(a.x-b.x,a.y-b.y); z0=z;
      const r=visor.getBoundingClientRect();
      mid0={x:(a.x+b.x)/2-r.left, y:(a.y+b.y)/2-r.top};
    }
    if(ptrs.size===1){ arrastou=false; mexeu=false; ecoDeToque(e); }
  });
  visor.addEventListener("pointermove",e=>{
    const p=ptrs.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    p.x=e.clientX; p.y=e.clientY;
    /* Tolerância maior no dedo do que no mouse: a mão treme, o dedo rola sobre
       o vidro e a área de contato é larga. Com 8 px, um toque comum de celular
       virava "arrasto" e era descartado sem que o aluno entendesse por quê. */
    const folga = (e.pointerType==="touch") ? 18 : 8;
    if(Math.hypot(e.clientX-p.x0, e.clientY-p.y0)>folga) arrastou=true;

    if(ptrs.size===2 && dist0>0){
      const [a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      arrastou=true; mexeu=true;
      zoomEm(z0*(d/dist0), mid0.x, mid0.y);
    }else if(ptrs.size===1 && arrastou && z>1.001){
      if(!capturado){ try{ visor.setPointerCapture(e.pointerId); capturado=e.pointerId; }catch(_){} }
      mexeu=true;
      tx+=dx; ty+=dy; aplicar(); visor.classList.add("arrastando");
    }
  });
  let suprimir=false, suprimirT=null;
  function soltar(e){
    ptrs.delete(e.pointerId);
    visor.classList.remove("arrastando");
    if(capturado===e.pointerId){
      try{ visor.releasePointerCapture(e.pointerId); }catch(_){}
      capturado=null;
    }
    if(ptrs.size<2) dist0=0;
    /* Só descarta o clique se a cena REALMENTE se mexeu. Na visão geral não há
       o que arrastar: ali um dedo que escorrega alguns pixels continua sendo
       uma resposta válida, e antes era engolido em silêncio. */
    if(mexeu){
      suprimir=true;
      clearTimeout(suprimirT);
      suprimirT=setTimeout(()=>{ suprimir=false; },400);
    }
    if(ptrs.size===0){ arrastou=false; mexeu=false; }
  }
  visor.addEventListener("pointerup",soltar);
  visor.addEventListener("pointercancel",soltar);
  /* captura: se houve arrasto, o toque não vira resposta */
  visor.addEventListener("click",e=>{
    if(suprimir){ suprimir=false; clearTimeout(suprimirT); e.stopPropagation(); e.preventDefault(); }
  },true);

  const btMais=el("button",{class:"zbtn",type:"button","aria-label":"Ampliar",
    onclick:()=>zoomEm(z+0.6, visor.clientWidth/2, visor.clientHeight/2)},"+");
  const btMenos=el("button",{class:"zbtn",type:"button","aria-label":"Reduzir",
    onclick:()=>zoomEm(z-0.6, visor.clientWidth/2, visor.clientHeight/2)},"−");
  const btReset=el("button",{class:"zbtn",type:"button","aria-label":"Voltar à visão geral",
    style:"font-size:.72rem;padding:0 10px",onclick:()=>{ z=1; tx=0; ty=0; aplicar(); anunciar("Visão geral restaurada."); }},"Visão geral");
  const info=el("span",{class:"info"},"Toque para inspecionar");

  const barra=el("div",{class:"visor-barra"}, btMenos, btMais, btReset, info);

  /* Roda do mouse amplia no ponto do cursor — esperado em um visor de
     inspeção no computador. */
  visor.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=visor.getBoundingClientRect();
    zoomEm(z*(e.deltaY<0?1.2:1/1.2), e.clientX-r.left, e.clientY-r.top);
  },{passive:false});

  /* Teclado: + e - ampliam, 0 volta à visão geral, setas movem. */
  visor.tabIndex=0;
  visor.setAttribute("aria-label","Visor da cena. Mais e menos ampliam, setas movem a área ampliada, zero volta à visão geral. A ficha de inspeção ao lado traz a mesma cena em texto.");
  visor.addEventListener("keydown",e=>{
    const passo=48;
    if(e.key==="+"||e.key==="="){ e.preventDefault(); zoomEm(z+0.6, visor.clientWidth/2, visor.clientHeight/2); }
    else if(e.key==="-"||e.key==="_"){ e.preventDefault(); zoomEm(z-0.6, visor.clientWidth/2, visor.clientHeight/2); }
    else if(e.key==="0"){ e.preventDefault(); z=1; tx=0; ty=0; aplicar(); anunciar("Visão geral restaurada."); }
    else if(e.key.indexOf("Arrow")===0 && z>1.001){
      e.preventDefault();
      if(e.key==="ArrowLeft") tx+=passo; else if(e.key==="ArrowRight") tx-=passo;
      else if(e.key==="ArrowUp") ty+=passo; else ty-=passo;
      aplicar();
    }
  });

  const legenda=el("p",{class:"legenda-sim"},
    "Imagem: simulação encenada, gerada para fins educacionais. Pessoas e ambiente fictícios.");
  caixa.appendChild(visor);
  caixa.appendChild(barra);
  caixa.appendChild(legenda);

  /* Em tela larga a foto é limitada pela ALTURA da janela, não pela largura:
     sem isso, um retrato 3:4 numa coluna de 700 px passaria de 930 px de
     altura e não caberia na tela do computador. */
  function dimensionar(){
    const r = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth/img.naturalHeight : 0.75;
    const pai = caixa.parentElement;
    const cw = (pai ? pai.clientWidth : 0) || visor.clientWidth || 360;
    let w = cw;
    if(window.innerWidth>=920){
      /* mede o que realmente sobra: o topo da caixa no documento, mais a
         barra de zoom, a legenda e o rodapé fixo. Assim a cena inteira cabe
         sem rolagem em qualquer altura de janela, sem número chutado. */
      const topoDoc = caixa.getBoundingClientRect().top + window.scrollY;
      const rodape = document.getElementById("rodape");
      const extras = (barra.offsetHeight||56) + (legenda.offsetHeight||26)
                   + ((rodape && !rodape.classList.contains("oculto")) ? rodape.offsetHeight : 0) + 18;
      const alturaUtil = Math.max(280, window.innerHeight - topoDoc - extras);
      /* piso: nunca menor que 380 px de largura, para a inspeção não piorar
         no computador em relação ao celular. Se isso exigir rolar alguns
         pixels numa janela muito baixa, rolar é o mal menor. */
      w = Math.max(Math.min(cw, 380), Math.min(cw, alturaUtil*r));
      caixa.style.width = Math.round(w)+"px";
      caixa.style.marginLeft = "auto"; caixa.style.marginRight = "auto";
    }else{
      /* no celular quem manda é o CSS: width 100% dentro da caixa sangrada
         até a borda da tela. Forçar largura aqui encolhia a foto e deixava
         uma faixa escura à direita. */
      caixa.style.width=""; caixa.style.marginLeft=""; caixa.style.marginRight="";
      visor.style.width="";
      return;
    }
    visor.style.width = Math.round(w)+"px";
  }

  /* um único ouvinte global de redimensionamento, apontado para o visor vivo:
     evita acumular ouvintes a cada troca de cena. */
  aplicarVisorAtual = ()=>{ dimensionar(); aplicar(); };
  requestAnimationFrame(aplicarVisorAtual);
  if(img.complete) requestAnimationFrame(aplicarVisorAtual);
  return caixa;
}

/* Ficha de inspeção que acompanha a foto: aberta ao lado dela no computador,

/* ========================================================================
   [ENGINE] — FICHA DE INSPEÇÃO (modo textual e apoio à foto)
   Descrições neutras. Não revela o gabarito: não conformidades, elementos
   adequados e regiões neutras aparecem descritos do mesmo modo.
   ======================================================================== */
function descricaoNeutra(a){
  if(a.tipo==="nc") return a.d.evidenciaObservavel;
  if(a.tipo==="ok") return a.d.observado;
  return a.d.nota.split(". Nada a registrar")[0]+".";
}
function montarFicha(cena, embutida){
  const env=el("div");
  if(!embutida){
    if(!temFoto(cena.id)){
      env.appendChild(el("div",{class:"aviso"},
        el("p",{},el("b",{},"Fotografia desta cena ainda não incorporada. "),
          "A inspeção segue pela ficha, que é o equivalente textual completo. Nenhum desenho foi colocado no lugar da foto.")));
    }
    env.appendChild(el("div",{class:"cartao suave"},
      el("div",{class:"rotulo"},"Enquadramento"),
      el("p",{style:"margin:0;font-size:.85rem"}, cena.resumoNeutro)));
  }
  const lista=[...itensDaCena(cena.id), ...adequadosDaCena(cena.id), ...neutrosDaCena(cena.id)]
    .map(d=>alvoPorId(d.id)).filter(Boolean);
  /* ordem estável por posição vertical na cena, para parecer uma varredura */
  lista.sort((a,b)=>(a.d.hotspot?.y??0)-(b.d.hotspot?.y??0));
  lista.forEach(a=>{
    const est=estadoAlvo(a.d.id), E=ESTADOS[est];
    env.appendChild(el("button",{class:"ficha-item "+(E?E.cls:""),type:"button",
      onclick:()=>inspecionar(a.d.id, cena)},
      el("span",{class:"loc"}, a.d.ondeEsta),
      el("span",{}, descricaoNeutra(a)),
      E?el("span",{class:"est"}, el("span",{class:"selo "+seloDe(est)}, E.ic+" "+E.txt)):null
    ));
  });
  return env;
}

function usarPista(cena){
  const usadas=S.pistas[cena.id]||0;
  if(usadas>=CONFIG.PISTAS_POR_CENA){ toast("As pistas desta cena já foram usadas."); return; }
  const pend=itensDaCena(cena.id).filter(i=>!leReg(i.id).identificado);
  if(!pend.length){ toast("Todos os itens desta cena já foram identificados."); return; }
  const alvo=pend.sort((a,b)=>(a.prioridadeDidatica==="alta"?-1:1)-(b.prioridadeDidatica==="alta"?-1:1))[0];
  S.pistas[cena.id]=usadas+1;
  alvo._pistaDada=true;
  const nivel=usadas+1;
  abrirModal(`Pista ${nivel} de ${CONFIG.PISTAS_POR_CENA}`,(c)=>{
    c.appendChild(el("p",{class:"miudo"}, nivel===1 ? "Esta pista indica uma região." : "Esta pista indica o mecanismo de risco."));
    c.appendChild(el("div",{class:"aviso info"}, el("p",{}, alvo.pistas[Math.min(nivel-1, alvo.pistas.length-1)])));
    c.appendChild(el("p",{class:"miudo-2"},"O uso da pista fica registrado no relatório e não retira nada do que você já conquistou. Itens encontrados com pista aparecem separados dos encontrados sozinho."));
  });
  const bt=$("#btPista");
  if(bt && S.pistas[cena.id]>=CONFIG.PISTAS_POR_CENA){ bt.disabled=true; bt.textContent="Pistas usadas"; }
}

function inspecionar(id, cena){
  const a=alvoPorId(id); if(!a) return;
  if(a.tipo==="nt") return inspecionarNeutro(a.d);
  if(a.tipo==="ok") return inspecionarAdequado(a.d);
  return inspecionarItem(a.d, cena);
}

function inspecionarItem(it, cena){
  const r=regDe(it.id);

function responderConduta(c, it, escolha, cena){
  const r=regDe(it.id);
  const fb=it.feedbackPorAlternativa[escolha];
  const certa = escolha===it.condutaCorreta;
  if(r.tentativas===0){ r.condutaPrimeira=escolha; r.acertouPrimeira=certa; }
  r.tentativas++;
  if(certa){ r.resolvido=true; bip("ok"); anunciar("Conduta adequada. Brecha tratada na simulação."); }
  else { bip("rever"); anunciar("Conduta a rever."); }

  limpar(c);
  c.appendChild(el("div",{class:"aviso "+(certa?"bom":(fb.tipo==="insuficiente"?"":"grave"))},
    el("p",{},
      el("span",{class:"selo "+(certa?"ok":(fb.tipo==="insuficiente"?"at":"rv"))},
        certa?"✓ Conduta adequada":(fb.tipo==="insuficiente"?"~ Insuficiente":"✕ Conduta a rever"))),
    el("p",{style:"margin:.5em 0 0;font-size:.88rem"}, el("b",{},"Você escolheu: "), it.alternativasDeConduta[escolha]),
    el("p",{style:"margin:.5em 0 0;font-size:.88rem"}, fb.texto)
  ));

  if(!certa){
    c.appendChild(el("p",{class:"miudo",style:"margin-top:10px"},"Sua primeira resposta ficou registrada. Você pode escolher outra conduta agora: isso completa a blindagem da simulação e não altera o registro da primeira tentativa."));
    it.alternativasDeConduta.forEach((txt,i)=>{
      if(i===escolha) return;
      c.appendChild(el("button",{class:"opcao",type:"button",
        onclick:()=>responderConduta(c, it, i, cena)},
        el("span",{class:"letra"},"ABC"[i]+")"), txt));
    });
  }else{
    c.appendChild(el("div",{class:"aviso info"},
      el("p",{style:"margin:0"},el("b",{},"O marcador é da simulação. "),
        "A fotografia não foi corrigida — ela continua mostrando a mesma cena. O que mudou foi o seu registro de auditoria.")));
  }
  c.appendChild(blocoEntenderMelhor(it));
  c.appendChild(el("div",{class:"btn-linha",style:"margin-top:12px"},
    el("button",{class:"btn sec",type:"button",onclick:()=>fecharModal()},"Voltar à cena")));
  if(cena) atualizarContador(cena);
  pintarPassos();
}

/* ========================================================================
   [ETAPA2] — CONECTAR AS CAMADAS
   Prática orientada: o aluno já recebeu as explicações na Etapa 1.
   A pontuação daqui não é lida como diagnóstico independente.
   ======================================================================== */
function dificuldadeDe(id){
  const r=S.itens[id];
  if(!r || !r.identificado) return 100;      /* não encontrado: prioridade máxima */
  let d=0;
  if(r.naRevisao) d+=40;
  if(r.comPista) d+=25;
  if(!r.acertouPrimeira) d+=20;
  if(!r.resolvido) d+=15;
  return d;
}
function montarCartoesEtapa2(){
  const at=itensAtivos().slice();
  at.sort((a,b)=>dificuldadeDe(b.id)-dificuldadeDe(a.id));
  const n=Math.min(CONFIG.CARTOES_ETAPA2, at.length);
  const esc=[], usados=new Set();
  /* garante a presença de todas as camadas representadas no banco ativo */
  const camadasNoBanco=[...new Set(at.map(i=>i.camadaPrincipal))];
  camadasNoBanco.forEach(cm=>{
    if(esc.length>=n) return;
    const c=at.find(i=>i.camadaPrincipal===cm && !usados.has(i.id));
    if(c){ esc.push(c); usados.add(c.id); }
  });
  /* completa pelos mais difíceis */
  for(const i of at){ if(esc.length>=n) break; if(!usados.has(i.id)){ esc.push(i); usados.add(i.id); } }
  esc.sort((a,b)=>dificuldadeDe(b.id)-dificuldadeDe(a.id));
  return esc;
}
function iniciarEtapa2(){
  pararCrono();
  S.e2.cartoes=montarCartoesEtapa2(); S.e2.idx=0; S.e2.resp={};
  telaEtapa2();
}

  t.appendChild(el("p",{class:"miudo"},"Prática orientada. Você já recebeu a explicação de cada item na Etapa 1; aqui o exercício é de classificação. O resultado desta etapa não é lido como um diagnóstico à parte."));
  t.appendChild(el("div",{class:"hud"},
    el("span",{class:"contador"},`Cartão ${S.e2.idx+1} de ${total}`)));

  const cartao=el("div",{class:"cartao"});
  cartao.appendChild(el("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"},
    (!r || !r.identificado) ? el("span",{class:"selo at"},"⚠ Não encontrado na inspeção") : null,

    (r && r.naRevisao) ? el("span",{class:"selo neutro"},"visto na revisão") : null
  ));
  cartao.appendChild(el("h2",{style:"font-size:1rem;margin-bottom:6px"}, it.item));
  cartao.appendChild(el("p",{class:"miudo",style:"margin:0"}, it.evidenciaObservavel));
  t.appendChild(cartao);

  t.appendChild(el("div",{class:"rotulo",style:"margin-top:12px"},"Qual camada é mais diretamente envolvida neste caso?"));
  const grade=el("div",{class:"grade-camadas"});
  Object.keys(CAMADAS).forEach(k=>{
    grade.appendChild(el("button",{class:"camada-btn",type:"button",onclick:()=>responderCamada(it,k)},
      el("span",{}, el("span",{class:"ic","aria-hidden":"true"}, CAMADAS[k].ic), CAMADAS[k].curto)));

/* ========================================================================
   [ETAPA3] — DECISÃO EM CABINE
   Três por partida: dois pelas camadas com mais dificuldade e sempre o de
   resposta a incidente. Os demais ficam como prática adicional.
   ======================================================================== */
function dificuldadePorCamada(){
  const r={};
  Object.keys(CAMADAS).forEach(k=>{
    const its=itensAtivos().filter(i=>i.camadaPrincipal===k);
    if(!its.length){ r[k]={n:0,score:-1}; return; }
    r[k]={ n:its.length, score: its.reduce((s,i)=>s+dificuldadeDe(i.id),0)/its.length };
  });
  return r;
}
function iniciarEtapa3(){
  const dif=dificuldadePorCamada();
  const incidente=DILEMAS.filter(d=>d.sempre);
  const outros=DILEMAS.filter(d=>!d.sempre)
    .sort((a,b)=>((dif[b.camada]?.score??0)-(dif[a.camada]?.score??0)));
  const nOutros=Math.max(0, Math.min(CONFIG.DILEMAS_POR_PARTIDA-incidente.length, outros.length));
  /* escolhe pelos maiores scores de dificuldade, mas evita repetir a mesma
     camada enquanto houver outra camada disponível: dois dilemas do mesmo
     eixo desperdiçam uma das três vagas da partida. */
  const escolhidos=[], camadasUsadas=new Set();
  for(const d of outros){
    if(escolhidos.length>=nOutros) break;
    if(camadasUsadas.has(d.camada)) continue;
    escolhidos.push(d); camadasUsadas.add(d.camada);
  }
  for(const d of outros){
    if(escolhidos.length>=nOutros) break;
    if(!escolhidos.includes(d)) escolhidos.push(d);
  }
  S.e3.lista=[...escolhidos, ...incidente];
  S.e3.extras=outros.filter(d=>!escolhidos.includes(d));
  S.e3.idx=0; S.e3.resp={};
  telaEtapa3();
}

   Denominadores sempre visíveis. Empates tratados explicitamente.

function estatisticasPorCamada(){
  const out={};
  Object.keys(CAMADAS).forEach(k=>{
    const its=itensAtivos().filter(i=>i.camadaPrincipal===k);
    const R=id=>S.itens[id]||{};
    out[k]={
      total: its.length,
      semPista: its.filter(i=>{const r=R(i.id); return r.identificado && !r.comPista && !r.naRevisao;}).length,
      comPista: its.filter(i=>{const r=R(i.id); return r.identificado && r.comPista && !r.naRevisao;}).length,
      naRevisao: its.filter(i=>R(i.id).naRevisao).length,
      condutaPrimeira: its.filter(i=>R(i.id).acertouPrimeira).length,
      condutaDepois: its.filter(i=>{const r=R(i.id); return r.resolvido && !r.acertouPrimeira;}).length,
      naoEncontrados: its.filter(i=>!R(i.id).identificado).length,
      blindagem: its.length ? its.reduce((s,i)=>s+blindagemItem(i.id),0)/its.length : 0
    };
  });
  return out;
}

function leituraQualitativa(est, at){
  const w=el("div",{class:"cartao"});
  const R=id=>S.itens[id]||{};
  const comDados=Object.keys(CAMADAS).filter(k=>est[k].total>0);
  const suficientes=comDados.filter(k=>est[k].total>=2);
  if(!comDados.length){
    w.appendChild(el("p",{},"Nenhum item ativo no banco: não há leitura a fazer. Verifique CENAS_ATIVAS e ITENS_DESATIVADOS em CONFIG."));
    return w;
  }

  /* ponto forte: maior proporção sem pista, entre camadas com dado suficiente */
  const base = suficientes.length?suficientes:comDados;
  const prop = k => est[k].total ? est[k].semPista/est[k].total : 0;
  const maxP = Math.max(...base.map(prop));
  const fortes = base.filter(k=>Math.abs(prop(k)-maxP)<1e-9);
  const minP = Math.min(...base.map(prop));
  const fracos = base.filter(k=>Math.abs(prop(k)-minP)<1e-9);

  w.appendChild(el("div",{class:"rotulo"},"Principal ponto forte"));
  if(maxP===0){
    w.appendChild(el("p",{style:"font-size:.88rem"},"Nenhuma camada teve item identificado sem pista nesta partida, então não há ponto forte a destacar com base em dado — e inventar um não ajudaria você."));
  }else if(fortes.length>1){
    w.appendChild(el("p",{style:"font-size:.88rem"},
      `Empate entre ${fortes.map(k=>CAMADAS[k].curto).join(" e ")}, com a mesma proporção de achados sem pista (${fortes.map(k=>`${est[k].semPista}/${est[k].total}`).join(", ")}). O empate está sendo dito em vez de desempatado por critério arbitrário.`));
  }else{
    w.appendChild(el("p",{style:"font-size:.88rem"},
      `${CAMADAS[fortes[0]].nome}: ${est[fortes[0]].semPista} de ${est[fortes[0]].total} itens identificados sem pista. É onde a sua leitura da cena foi mais direta.`));
  }

  w.appendChild(el("div",{class:"rotulo",style:"margin-top:12px"},"Camada que merece mais atenção"));
  if(maxP===minP){
    w.appendChild(el("p",{style:"font-size:.88rem"},"Todas as camadas com dado suficiente ficaram na mesma proporção. Não há base para apontar uma como mais frágil nesta partida."));
  }else if(fracos.length>1){
    w.appendChild(el("p",{style:"font-size:.88rem"},
      `Empate entre ${fracos.map(k=>CAMADAS[k].curto).join(" e ")} (${fracos.map(k=>`${est[k].semPista}/${est[k].total}`).join(", ")}). Vale olhar as duas, não escolher uma.`));
  }else{
    const k=fracos[0], ne=est[k].naoEncontrados;
    w.appendChild(el("p",{style:"font-size:.88rem"},
      `${CAMADAS[k].nome}: ${est[k].semPista} de ${est[k].total} identificados sem pista, `+
      (ne===0 ? "nenhum item ficou sem identificação" : ne===1 ? "1 item não foi encontrado" : `${ne} itens não foram encontrados`)+
      `. ${CAMADAS[k].desc}`));
  }
  const insuf=comDados.filter(k=>est[k].total<2);
  if(insuf.length){
    w.appendChild(el("p",{class:"miudo-2"},
      `Sem dado suficiente para conclusão: ${insuf.map(k=>`${CAMADAS[k].curto} (${est[k].total} ${est[k].total===1?"item":"itens"})`).join(", ")}. Uma camada com um ou dois itens não sustenta afirmação sobre tendência.`));
  }

  /* até três ações concretas */
  w.appendChild(el("div",{class:"rotulo",style:"margin-top:12px"},"Até três ações concretas para a prática"));
  const acoes=[];
  const naoAchados=at.filter(i=>!R(i.id).identificado);
  const condutaErrada=at.filter(i=>R(i.id).identificado && !R(i.id).acertouPrimeira);
  if(naoAchados.length) acoes.push(`Fazer uma varredura dirigida do que passou despercebido aqui: ${naoAchados.slice(0,3).map(i=>i.item.toLowerCase()).join("; ")}. Comece a inspeção da sua cabine por esses pontos.`);
  if(condutaErrada.length) acoes.push(`Rever a conduta, não só a identificação: em ${condutaErrada.length} ${condutaErrada.length===1?"item":"itens"} você viu o risco e escolheu uma correção que não resolvia. Ver e corrigir são competências separadas.`);
  const pendInt=at.filter(i=>i.requerInterrupcao && !(R(i.id).identificado && R(i.id).resolvido));
  if(pendInt.length) acoes.push(`Definir com a equipe, por escrito, quais situações autorizam interromper um atendimento em curso. Nesta partida ${pendInt.length} ${pendInt.length===1?"situação ficou pendente":"situações ficaram pendentes"}.`);
  if(acoes.length<3) acoes.push("Confrontar o POP afixado na sua cabine com o que acontece de fato num atendimento. Nesta simulação, quatro não conformidades contrariam o POP que está na parede.");
  const ol=el("ol",{style:"font-size:.88rem;margin:0"});
  acoes.slice(0,3).forEach(a=>ol.appendChild(el("li",{},a)));
  w.appendChild(ol);

  /* risco relevante não percebido */
  w.appendChild(el("div",{class:"rotulo",style:"margin-top:12px"},"Um risco relevante que passou despercebido no início"));
  const cand = at.filter(i=>{const r=R(i.id); return !r.identificado || r.naRevisao || r.comPista;})
                 .sort((a,b)=>(a.prioridadeDidatica==="alta"?-1:1)-(b.prioridadeDidatica==="alta"?-1:1));
  if(cand.length){
    const i=cand[0];
    w.appendChild(el("p",{style:"font-size:.88rem"},
      el("b",{}, i.item), " — ", i.porqueEhRisco));
  }else{
    w.appendChild(el("p",{style:"font-size:.88rem"},"Nenhum: você identificou todos os itens sozinho, sem pista e sem revisão. Vale um contraponto honesto — uma cena preparada para ser inspecionada é bem mais legível que uma cabine em dia comum."));
  }

  /* pergunta para discussão */
  w.appendChild(el("div",{class:"rotulo",style:"margin-top:12px"},"Uma pergunta para discussão em aula"));
  const cm = fracos[0] || comDados[0];
  const perguntas={
    protecao:"Quando a barreira existe no serviço mas não está no corpo de quem atende, de quem é o problema: da pessoa, da compra ou da rotina? O que muda na resposta se a falta for de um item só?",
    comportamento:"Das falhas de comportamento desta cabine, quantas você já viu acontecer — e em quantas alguém disse alguma coisa na hora? O que faz ser difícil falar?",
    residuos:"O acidente com perfurocortante acontece mais no descarte do que no procedimento. Na sua rotina, quem decide a hora de trocar o coletor, e essa pessoa está na sala?",
    estrutura:"Quais gestos corretos a estrutura da sua cabine torna mais difíceis do que precisariam ser? Liste um, e quem teria de autorizar a mudança."
  };
  w.appendChild(el("p",{style:"margin:0;font-size:.88rem"}, perguntas[cm]||perguntas.comportamento));
  return w;
}

function praticaExtra(d){
  const idx=S.e3.lista.length;
  S.e3.lista.push(d);
  S.e3.extras=S.e3.extras.filter(x=>x.id!==d.id);
  S.e3.idx=idx;
  telaEtapa3();
}

function revisarDificuldades(){
  const at=itensAtivos();
  const R=id=>S.itens[id]||{};
  const alvo=at.filter(i=>{const r=R(i.id); return !r.identificado || !r.resolvido || !r.acertouPrimeira;});
  abrirModal("Revisar minhas dificuldades",(c)=>{
    c.appendChild(el("p",{class:"miudo"},"O resultado inicial não é apagado. Abrir os itens aqui completa a blindagem da simulação e mantém intactos os registros de percepção inicial e de primeira tentativa."));
    if(!alvo.length){ c.appendChild(el("p",{},"Nada pendente: todos os itens foram identificados e receberam a conduta adequada na primeira tentativa.")); return; }
    alvo.forEach(i=>{
      const r=R(i.id);
      const marca = !r.identificado ? "não identificado" : (!r.resolvido ? "sem conduta adequada" : "conduta corrigida depois do feedback");
      c.appendChild(el("button",{class:"ficha-item",type:"button",
        onclick:()=>{ fecharModal(true); abrirItemAvulso(i); }},
        el("span",{class:"loc"}, CAMADAS[i.camadaPrincipal].curto+" · "+marca),
        el("span",{}, i.item)));
    });
  });
}
function abrirItemAvulso(it){
  abrirModal(it.item,(c)=>{ corpoDoItem(c, it, null); },{aoFechar:()=>telaRelatorio()});
}

/* ========================================================================
   [RELATORIO] — RESUMO COPIÁVEL (sem dados pessoais obrigatórios)
   ======================================================================== */
function textoResumo(est, at, semP, comP, blind, pend){
  const R=id=>S.itens[id]||{};
  const L=[];
  L.push("BLINDAGEM TOTAL: CABINE LIMPA — resumo de auditoria");
  L.push("Cenário: limpeza de pele facial com extração de comedões, extração em curso.");
  L.push("");
  L.push(`PERCEPÇÃO INICIAL: ${semP+comP} de ${at.length} itens (${semP} sem pista, ${comP} com pista).`);
  L.push(`BLINDAGEM DA SIMULAÇÃO: ${Math.round(blind*100)}% (metade identificação, metade conduta).`);
  L.push("Estes números descrevem o desempenho nesta simulação. Não medem a segurança de uma clínica real nem certificam competência.");
  L.push("");
  L.push("POR CAMADA (itens | sem pista | com pista | só na revisão | conduta 1a | corrigida)");
  Object.keys(CAMADAS).forEach(k=>{ const e=est[k]; if(!e.total) return;
    L.push(`- ${CAMADAS[k].curto}: ${e.total} | ${e.semPista}/${e.total} | ${e.comPista}/${e.total} | ${e.naRevisao}/${e.total} | ${e.condutaPrimeira}/${e.total} | ${e.condutaDepois}/${e.total}`); });
  L.push("");
  L.push("PENDÊNCIAS QUE EXIGIRIAM INTERROMPER O ATENDIMENTO:");
  if(pend.length) pend.forEach(i=>L.push(`- ${i.item} (${i.ondeEsta})`));
  else L.push("- Nenhuma.");
  L.push("");
  const usadas=Object.values(S.pistas).reduce((a,b)=>a+b,0);
  L.push(`PISTAS UTILIZADAS: ${usadas}.`);
  const insp=Object.keys(S.adequados).length;
  L.push(`ELEMENTOS ADEQUADOS INSPECIONADOS: ${insp} de ${ADEQUADOS.filter(a=>CONFIG.CENAS_ATIVAS.includes(a.cenaId)).length}.`);
  L.push("");
  L.push("ETAPA 2 — CAMADAS:");
  const rs=Object.values(S.e2.resp);
  L.push(`- ${rs.filter(r=>r.principal).length}/${rs.length} na camada principal; ${rs.filter(r=>r.alternativa).length} em associação alternativa prevista.`);
  L.push("");
  L.push("ETAPA 3 — DILEMAS:");
  S.e3.lista.forEach(d=>{
    const r=S.e3.resp[d.id]; if(!r) return;
    let s=`- ${d.titulo}: 1a resposta ${r.ok1?"adequada":"a rever"}`;
    if(!r.ok1 && r.falha1) s+=` (falha por ${r.falha1==="acomodacao"?"acomodação":"omissão"})`;
    if(r.p2!==undefined) s+=`; 2a decisão ${r.ok2?"adequada":"a rever"}`;
    L.push(s);
  });
  L.push("");
  L.push("DESAFIO DE TRANSFERÊNCIA: qual mudança você faria amanhã na organização ou na rotina da sua cabine?");
  L.push("");
  L.push("\"A camada mais frágil é a que ninguém fotografa.\"");
  return L.join("\n");
}
function blocoResumo(est, at, semP, comP, blind, pend){
  const d=el("details",{class:"mais"});
  d.appendChild(el("summary",{},"Resumo para copiar"));
  const c=el("div");
  const txt=textoResumo(est, at, semP, comP, blind, pend);
  const ta=el("textarea",{class:"resumo",readonly:"readonly","aria-label":"Resumo da auditoria em texto"}); ta.value=txt;
  c.appendChild(el("p",{class:"miudo-2"},"Sem dados pessoais. Nenhum nome é pedido e nada é enviado a lugar nenhum: a cópia acontece no seu aparelho."));
  c.appendChild(el("div",{class:"btn-linha",style:"margin-bottom:9px"},
    el("button",{class:"btn sec",type:"button",onclick:async(e)=>{
      try{
        if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); toast("Resumo copiado."); }
        else throw new Error("sem clipboard");
      }catch(err){
        ta.removeAttribute("readonly"); ta.focus(); ta.select();
        toast("Não foi possível copiar automaticamente. O texto está selecionado abaixo.");
      }
    }},"Copiar resumo")));
  c.appendChild(ta);
  d.appendChild(c); return d;
}

/* ========================================================================
   [ENGINE] — REINICIAR E INICIALIZAÇÃO
   ======================================================================== */
function houveProgresso(){
  const algumItem = Object.values(S.itens).some(r=>r.identificado || r.tentativas>0);
  return S.iniciado && (algumItem || Object.keys(S.adequados).length>0
    || Object.keys(S.neutros).length>0
    || Object.keys(S.e2.resp).length>0 || Object.keys(S.e3.resp).length>0);
}
function zerar(){
  pararCrono();
  S.iniciado=false; S.idxCena=0; S.emRevisao=false;
  S.itens={}; S.adequados={}; S.neutros={}; S.pistas={}; S.esgotou={};
  S.e2={cartoes:[],idx:0,resp:{}}; S.e3={lista:[],idx:0,resp:{},extras:[]};
  BANCO.forEach(i=>{ delete i._pistaDada; });
  telaAbertura();
}
function pedirReiniciar(){
  if(!houveProgresso()){ zerar(); return; }
  confirmar("Reiniciar a sessão?",
    "Tudo o que você respondeu será apagado, inclusive o relatório. Como nada é salvo no aparelho, não há como recuperar depois.",
    "Reiniciar mesmo assim", zerar, true);
}

/* --topo guarda a altura real do cabeçalho fixo; é o deslocamento usado
   pela coluna da foto quando ela acompanha a rolagem em telas largas. */
function medirTopo(){
  const h=document.getElementById("topo");
  if(h) document.documentElement.style.setProperty("--topo", h.offsetHeight+"px");
}

function ligarCabecalho(){
  /* o cabeçalho muda de altura conforme o texto quebra; um observador mantém
     --topo sempre correto, em vez de medir uma vez e torcer. */
  const cab=document.getElementById("topo");
  if(cab && window.ResizeObserver) new ResizeObserver(medirTopo).observe(cab);
  $("#btBriefing").onclick=abrirBriefing;
  $("#btReiniciar").onclick=pedirReiniciar;

  const bt=$("#btTexto");
  bt.onclick=()=>{
    S.modoTextual=!S.modoTextual;
    bt.setAttribute("aria-pressed",String(S.modoTextual));
    toast(S.modoTextual?"Modo textual ativado.":"Modo textual desativado.");
    anunciar(S.modoTextual?"Modo textual ativado. A inspeção segue pela ficha.":"Modo textual desativado.");
    if(S.tela==="cena" && refPintarCena) refPintarCena();
  };
  const bs=$("#btSom");
  bs.onclick=()=>{
    S.som=!S.som;
    bs.setAttribute("aria-pressed",String(S.som));
    toast(S.som?"Som ativado.":"Som desativado.");
    if(S.som) bip("ok");
  };
}

document.addEventListener("DOMContentLoaded",()=>{
  ligarCabecalho();
  medirTopo();
  pintarPassos();
  telaAbertura();
});
</script>
